name: Build Morphogenetic Code Distance release

on:
  push:
    branches: [main]
    paths:
      - 'Theoretical Research/An_Operational_Morphogenetic_Code_Distance_for_Tissue_Network_Resilience/paper.tex'
      - 'Theoretical Research/An_Operational_Morphogenetic_Code_Distance_for_Tissue_Network_Resilience/paper.bib'
      - 'Theoretical Research/An_Operational_Morphogenetic_Code_Distance_for_Tissue_Network_Resilience/verify_model.py'
      - 'Theoretical Research/An_Operational_Morphogenetic_Code_Distance_for_Tissue_Network_Resilience/deploy.py'
      - 'Theoretical Research/An_Operational_Morphogenetic_Code_Distance_for_Tissue_Network_Resilience/README.md'
      - '.github/workflows/build-mcd-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morphogenetic-code-distance-build
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'build(mcd):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_DIR: 'Theoretical Research/An_Operational_Morphogenetic_Code_Distance_for_Tissue_Network_Resilience'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned research dependencies and TeX
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.5' 'scipy==1.17.0' 'networkx==3.6.1' \
            'matplotlib==3.10.8' 'PyYAML==6.0.3'
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Execute reproducibility suite and isolated deploy tests
        shell: bash
        run: |
          set -euo pipefail
          D="$RELEASE_DIR"
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          mkdir -p "$PYTHONPYCACHEPREFIX"
          python -m py_compile "$D/verify_model.py" "$D/deploy.py"
          python "$D/verify_model.py"
          python "$D/deploy.py" --self-test

      - name: Compile the current manuscript from committed source
        shell: bash
        run: |
          set -euo pipefail
          D="$RELEASE_DIR"
          BUILD_DIR="$(mktemp -d)"
          trap 'rm -rf "$BUILD_DIR"' EXIT
          cp "$D/paper.tex" "$BUILD_DIR/paper.tex"
          cp -R "$D/figures" "$BUILD_DIR/figures"
          cd "$BUILD_DIR"
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          test -s paper.pdf
          test "$(pdfinfo paper.pdf | awk '/^Pages:/ {print $2}')" -ge 25
          pdftotext paper.pdf paper.txt
          grep -qi 'References' paper.txt
          cp paper.pdf "$GITHUB_WORKSPACE/$D/paper.pdf"
          cd "$GITHUB_WORKSPACE"
          python "$D/deploy.py" --validate-only --rebuild-pdf

      - name: Record exact build provenance and pending remote visual review
        shell: bash
        run: |
          set -euo pipefail
          python - "$RELEASE_DIR" "$GITHUB_SHA" <<'PY'
          import hashlib, json, pathlib, sys, subprocess
          d = pathlib.Path(sys.argv[1]); source_sha = sys.argv[2]
          pdf = d / 'paper.pdf'
          digest = hashlib.sha256(pdf.read_bytes()).hexdigest()
          pages = int(subprocess.check_output(['pdfinfo', str(pdf)], text=True).split('Pages:')[1].splitlines()[0].strip())
          review_path = d / 'results/pdf_visual_review.json'
          review = json.loads(review_path.read_text())
          review.update({
              'status': 'PENDING_REMOTE_REVIEW', 'page_count': pages,
              'pdf_sha256': digest, 'render_dpi': 120,
              'pages_reviewed': [],
              'contact_sheets': [],
              'review_method': 'The GitHub Actions PDF was rebuilt from the committed paper.tex and figures; a separate SHA-bound page render and visual review is required before closure.',
              'review_notes': ['Build succeeded from source.', 'No remote visual review is claimed by this workflow.']
          })
          review_path.write_text(json.dumps(review, indent=2) + '\n')
          matrix_path = d / 'results/release_check_matrix.json'
          matrix = json.loads(matrix_path.read_text())
          matrix['remote_build_source_sha'] = source_sha
          matrix['remote_pdf_sha256'] = digest
          matrix['remote_pdf_pages'] = pages
          matrix['remote_checks']['build_workflow'] = 'PASS'
          index = pathlib.Path('Theoretical Research/Readme.md').read_text()
          assert 'An Operational Morphogenetic Code Distance for Tissue-Network Resilience' in index, 'Parent research index entry is missing'
          matrix['remote_checks']['verification_workflow'] = 'PENDING'
          matrix['remote_checks']['post_commit_sha'] = 'PENDING'
          matrix['release_status'] = 'PENDING_REMOTE_VERIFICATION'
          for item in matrix['checks']:
              if item['id'] == 'remote_build_ci':
                  item['status'] = 'PASS'
                  item['evidence'] = f'GitHub Actions rebuilt paper.pdf from source at {source_sha}; PDF SHA-256 {digest}; pages={pages}.'
              elif item['id'] == 'remote_exact_sha_verification':
                  item['status'] = 'PENDING'
                  item['evidence'] = 'A separate exact-SHA verification run must execute after the build-artifact commit.'
              elif item['id'] == 'sha256_manifest':
                  item['status'] = 'PASS'
                  item['evidence'] = 'The build workflow regenerated the SHA-256 manifest after rebuilding PDF, figures, numerical outputs and the pending-review record.'
              elif item['id'] == 'parent_index_update':
                  item['status'] = 'PASS'
                  item['evidence'] = 'The committed parent index contains the release title and relative release-directory link.'
          matrix['checks'].append({
              'id':'remote_pdf_visual_review','area':'PDF quality','status':'PENDING',
              'evidence':f'GitHub-built PDF SHA-256 {digest} has not yet undergone a page-render review.'
          })
          matrix_path.write_text(json.dumps(matrix, indent=2) + '\n')
          audit_path = d / 'results/pdf_audit.md'
          audit_path.write_text(audit_path.read_text() + f'\n## GitHub Actions build\n\n- Source commit: `{source_sha}`.\n- Rebuilt PDF pages: {pages}.\n- Rebuilt PDF SHA-256: `{digest}`.\n- Remote page-by-page visual review: **PENDING**; no remote visual pass is claimed.\n')
          PY
          python "$RELEASE_DIR/deploy.py" --validate-only --skip-model

      - name: Commit generated release evidence and compiled PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$RELEASE_DIR/paper.pdf" "$RELEASE_DIR/figures" "$RELEASE_DIR/results"
          if git diff --cached --quiet; then
            echo 'No generated artifacts changed.'
          else
            git commit -m 'build(mcd): regenerate numerical evidence, figures and PDF'
            git push origin HEAD:main
          fi