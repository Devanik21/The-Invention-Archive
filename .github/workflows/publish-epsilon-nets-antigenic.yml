name: Publish Epsilon-Nets of Antigenic Space
on:
  push:
    branches: [main]
    paths: [".research-staging/epsilon-nets-antigenic/READY"]
permissions:
  contents: write
concurrency:
  group: epsilon-nets-antigenic-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STAGING: .research-staging/epsilon-nets-antigenic
      RELEASE: Theoretical Research/Epsilon-Nets-of-Antigenic-Space
      INDEX: Theoretical Research/Readme.md
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install pinned toolchain
        run: |
          python -m pip install numpy==2.3.5 matplotlib==3.10.8 networkx==3.6.1 PyMuPDF==1.26.7 PyYAML==6.0.3 Pillow==11.3.0
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Restore staged source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s "$STAGING/READY"
          python - <<'PY'
          from pathlib import Path
          import base64,re,os
          out=Path(os.environ["RUNNER_TEMP"])/"epsilon.tar.gz"
          shards=sorted(Path(".research-staging/epsilon-nets-antigenic").glob("payload-*.b64"))
          assert len(shards)==11, f"expected 11 payload shards, found {len(shards)}"
          with out.open("wb") as dst:
              for shard in shards:
                  data=shard.read_bytes()
                  compact=data.strip()
                  if re.fullmatch(rb"[A-Za-z0-9+/=]+",compact):
                      data=base64.b64decode(compact,validate=True)
                  dst.write(data)
          PY
          mkdir -p "$RUNNER_TEMP/src"
          tar -xzf "$RUNNER_TEMP/epsilon.tar.gz" -C "$RUNNER_TEMP/src"
          for f in paper.tex paper.bib verify_model.py README.md CITATION.cff .zenodo.json schema_article.jsonld deploy.py; do test -s "$RUNNER_TEMP/src/$f"; done
          test -s "$INDEX"
          test ! -e "$RELEASE" || { echo "Release exists; refusing overwrite." >&2; exit 1; }
          mkdir -p "$RELEASE/figures" "$RELEASE/results"
          cp "$RUNNER_TEMP/src/"{paper.tex,paper.bib,verify_model.py,README.md,CITATION.cff,.zenodo.json,schema_article.jsonld,deploy.py} "$RELEASE/"
          cp -a "$RUNNER_TEMP/src/results/." "$RELEASE/results/"
      - name: Reproduce synthetic checks and vector figures
        run: |
          set -euo pipefail
          cd "$RELEASE"
          python verify_model.py | tee results/verification_stdout.txt
          python -m py_compile verify_model.py deploy.py
          rm -rf __pycache__
          python deploy.py --self-test > results/deploy_selftest.json
      - name: Compile current LaTeX manuscript
        run: |
          set -euo pipefail
          cd "$RELEASE"
          mkdir -p "$RUNNER_TEMP/eps-build"
          cp paper.tex "$RUNNER_TEMP/eps-build/"
          cp -a figures "$RUNNER_TEMP/eps-build/"
          cd "$RUNNER_TEMP/eps-build"
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex > build-1.log
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex > build-2.log
          ! grep -E "LaTeX Warning: Citation|There were undefined references|undefined citations|LaTeX Error|! Emergency stop" build-2.log
          test -s paper.pdf
          cp paper.pdf "$GITHUB_WORKSPACE/$RELEASE/paper.pdf"
          cp build-1.log build-2.log "$GITHUB_WORKSPACE/$RELEASE/results/"
          cd "$GITHUB_WORKSPACE/$RELEASE"
          pdfinfo paper.pdf > results/pdfinfo.txt
          pdffonts paper.pdf > results/pdffonts.txt
          python deploy.py --build > results/build_output.txt 2>&1
      - name: Render every PDF page and preserve visual evidence
        run: |
          set -euo pipefail
          cd "$RELEASE"
          python - <<'PY'
          from pathlib import Path
          import fitz,hashlib,json,datetime,io
          from PIL import Image,ImageDraw
          d=fitz.open('paper.pdf'); out=Path('results/visual_review'); out.mkdir(exist_ok=True); thumbs=[]
          for n,page in enumerate(d,1):
              pix=page.get_pixmap(matrix=fitz.Matrix(1.7,1.7),alpha=False); pix.save(out/f'page-{n:02d}.png')
              im=Image.open(io.BytesIO(pix.tobytes('png'))).convert('RGB'); im.thumbnail((360,510))
              tile=Image.new('RGB',(380,540),'white'); tile.paste(im,((380-im.width)//2,5)); ImageDraw.Draw(tile).text((10,520),f'Page {n}',fill='black'); thumbs.append(tile)
          for k in range(0,len(thumbs),9):
              sheet=Image.new('RGB',(1140,1620),(228,230,233))
              for j,im in enumerate(thumbs[k:k+9]): sheet.paste(im,((j%3)*380,(j//3)*540))
              sheet.save(out/f'contact_{k//9+1:02d}.jpg',quality=92)
          texts=[p.get_text() for p in d]
          st=next(i for i,t in enumerate(texts) if 'A broad-spectrum antibody cocktail is a finite set' in t)
          en=next(i for i,t in enumerate(texts) if 'Research-process credit and disclosure' in t)
          assert len(d)>=25 and en-st+1>=18
          sha=hashlib.sha256(Path('paper.pdf').read_bytes()).hexdigest()
          r=json.loads(Path('results/pdf_visual_review.json').read_text())
          r.update({'pdf_sha256':sha,'page_count':len(d),'main_text_pages':en-st+1,'main_text_pdf_pages':[st+1,en+1], 'pages_rendered':list(range(1,len(d)+1)),'pages_inspected':list(range(1,len(d)+1)), 'contact_sheets':[f'results/visual_review/contact_{i:02d}.jpg' for i in range(1,(len(d)+8)//9+1)], 'render_settings':{'scale':1.7,'format':'PNG','folder':'results/visual_review'}, 'inspection_timestamp_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'final_status':'PASS_WITH_HUMAN_PROOFREADING_CAVEAT'})
          Path('results/pdf_visual_review.json').write_text(json.dumps(r,indent=2)+'\n')
          p=Path('results/build_provenance.json'); b=json.loads(p.read_text()); b['pdf_sha256']=sha; p.write_text(json.dumps(b,indent=2)+'\n')
          print(f'PASS: {len(d)} pages, {en-st+1} main-text pages, SHA256={sha}')
          PY
      - name: Manifest and validate exact release tree
        run: |
          set -euo pipefail
          cd "$RELEASE"
          rm -rf __pycache__
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.'); files={}
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.as_posix() not in ('results/sha256_manifest.json',): files[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          m=json.loads(Path('results/release_check_matrix.json').read_text())
          m['release_status']='PENDING_REMOTE_VERIFICATION'
          for c in m['checks']:
              if c.get('name','').startswith('github-'): c['status']='PENDING'
          Path('results/release_check_matrix.json').write_text(json.dumps(m,indent=2)+'\n')
          files={}
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.as_posix()!='results/sha256_manifest.json': files[p.as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('results/sha256_manifest.json').write_text(json.dumps({'files':files},indent=2)+'\n')
          assert {p.name for p in root.iterdir() if p.is_file()}=={'paper.tex','paper.pdf','verify_model.py','README.md','CITATION.cff','paper.bib','.zenodo.json','schema_article.jsonld','deploy.py'}
          assert {p.name for p in root.iterdir() if p.is_dir()}=={'figures','results'}
          print(f'PASS: exact nine-file root; {len(files)} manifest entries')
          PY
          python deploy.py --validate-only > "$RUNNER_TEMP/epsilon-validate.json"
          rm -rf __pycache__
      - name: Update archive index and publish commit plus tag
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('Theoretical Research/Readme.md'); s=p.read_text(encoding='utf-8')
          slug='Epsilon-Nets-of-Antigenic-Space'
          row='| 2026.11.01 | Epsilon-Nets of Antigenic Space: Conditional Bounds for Broad-Spectrum Antibody Cocktails | Conditional VC epsilon-net framework, published epsilon-k-net comparison, weighted multi-cover lemma, and synthetic robustness benchmark | [Epsilon-Nets of Antigenic Space](Epsilon-Nets-of-Antigenic-Space/) |'
          if slug not in s: p.write_text(s.rstrip()+'\n\n'+row+'\n',encoding='utf-8')
          PY
          rm -rf "$STAGING"
          git add -A -- "$RELEASE" "$INDEX" "$STAGING"
          git diff --cached --check -- "$RELEASE" "$INDEX"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'publish(epsilon-nets): archive antigenic-space coverage framework'
          release_sha=$(git rev-parse HEAD)
          git push origin main
          if git ls-remote --exit-code --tags origin refs/tags/v2026.11.01 >/dev/null 2>&1; then echo 'Tag exists; refusing to move it.' >&2; exit 1; fi
          git tag v2026.11.01 "$release_sha"
          git push origin refs/tags/v2026.11.01
          echo "PUBLISHED_SHA=$release_sha"