name: Publish Burst-Robust Master v2.0
on:
  push:
    branches: [main]
    paths:
      - ".research-staging/burst-master-v2/READY"
permissions:
  contents: write
concurrency:
  group: burst-robust-master-v2
  cancel-in-progress: false
jobs:
  build-and-publish:
    if: ${{ !contains(github.event.head_commit.message, 'publish(burst-master-v2)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible build toolchain
        run: |
          python -m pip install numpy==2.3.5 matplotlib==3.10.8 networkx==3.6.1 PyMuPDF==1.26.7 Pillow==11.3.0
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-xetex poppler-utils zip
      - name: Restore the master source bundle
        shell: bash
        run: |
          set -euo pipefail
          STAGING=".research-staging/burst-master-v2"
          RELEASE="Theoretical Research/Burst_Robust_Codes_for_Life_and_Qubits/Master_v2.0"
          cat "$STAGING"/payload.part* > "$RUNNER_TEMP/payload.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/payload.tar.gz.b64" > "$RUNNER_TEMP/payload.tar.gz"
          mkdir -p "$RUNNER_TEMP/payload"
          tar -xzf "$RUNNER_TEMP/payload.tar.gz" -C "$RUNNER_TEMP/payload"
          SRC="$RUNNER_TEMP/payload/payload"
          mkdir -p "$RELEASE/figures" "$RELEASE/results"
          cp "$SRC"/{paper.tex,paper.bib,verify_model.py,deploy.py,README.md,CITATION.cff,.zenodo.json,schema_article.jsonld} "$RELEASE/"
          cp -a "$SRC/results/." "$RELEASE/results/"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
      - name: Reproduce benchmark and figures
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE"
          python -m py_compile verify_model.py deploy.py
          python deploy.py --self-test
          python verify_model.py | tee results/verification_stdout.txt
      - name: Compile and preflight the 28–40 page master PDF
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE"
          latexmk -C paper.tex
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error paper.tex | tee results/latex_build_stdout.txt
          pdfinfo paper.pdf | tee results/pdfinfo.txt
          pdffonts paper.pdf | tee results/pdffonts_report.txt
          pdftotext -layout paper.pdf results/pdf_text_extract.txt
      - name: Render every page and close automated release checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE"
          python - <<'PY'
          from pathlib import Path
          import fitz, hashlib, json, datetime, csv
          from PIL import Image, ImageDraw
          root=Path("."); doc=fitz.open("paper.pdf")
          digest=hashlib.sha256(Path("paper.pdf").read_bytes()).hexdigest()
          pages=root/"results"/"pdf_pages"; pages.mkdir(exist_ok=True)
          thumbs=[]
          for n,page in enumerate(doc,1):
              pix=page.get_pixmap(matrix=fitz.Matrix(120/72,120/72),alpha=False)
              pix.save(pages/f"page-{n:02d}.png")
              im=Image.open(pages/f"page-{n:02d}.png").convert("RGB"); im.thumbnail((190,250))
              tile=Image.new("RGB",(210,280),"white"); tile.paste(im,((210-im.width)//2,5))
              ImageDraw.Draw(tile).text((8,260),f"Page {n:02d}",fill="black"); thumbs.append(tile)
          cols=4
          for k in range(0,len(thumbs),20):
              part=thumbs[k:k+20]; rows=(len(part)+cols-1)//cols
              sheet=Image.new("RGB",(cols*210,rows*280),(232,235,240))
              for i,im in enumerate(part): sheet.paste(im,((i%cols)*210,(i//cols)*280))
              sheet.save(root/"results"/f"pdf_contact_sheet_{k//20+1}.jpg",quality=92)
          full="\n".join(p.get_text() for p in doc)
          intro=next(i for i,p in enumerate(doc) if "1 Introduction: reliability under spatially extended events" in p.get_text())
          appendix=next(i for i,p in enumerate(doc) if "A Exact expected-occupancy calibration" in p.get_text())
          main_pages=appendix-intro+1
          review={
            "schema_version":"1.0","status":"RENDERED_CONTACT_SHEETS_READY_FOR_FINAL_HUMAN_PROOFREADING",
            "inspection_timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "paper_pdf_sha256":digest,"page_count":doc.page_count,"render_dpi":120,
            "all_pages_rendered":True,"pages_rendered":list(range(1,doc.page_count+1)),
            "pages_individually_reviewed":[],"contact_sheets_generated":True,
            "review_method":"All pages rendered at 120 dpi and arranged into contact sheets; visual preflight retained. Human proofreading remains recommended.",
            "final_disposition":"PREPRINT BUILD COMPLETE; final human proofreading recommended before journal submission."
          }
          (root/"results"/"pdf_visual_review.json").write_text(json.dumps(review,indent=2)+"\n")
          (root/"results"/"publication_quality_report.md").write_text(
            "# Publication-quality report\n\n"
            f"- PDF pages: {doc.page_count}\n- Main-text pages: {main_pages}\n"
            "- Figures: 12 numbered vector figures with PNG previews\n"
            "- Tables: 7 substantive tables in the current source\n"
            "- All PDF pages rendered at 120 dpi; contact sheets retained.\n"
            "- Fine-grained human proofreading is still recommended before journal submission.\n"
          )
          assert 28 <= doc.page_count <= 40, doc.page_count
          assert main_pages >= 18, main_pages
          assert len(list((root/"figures").glob("fig*.pdf")))==12
          assert len(list((root/"figures").glob("fig*.png")))==12
          assert len(list(csv.DictReader((root/"results"/"figure_inventory.csv").open())))==12
          PY
          python deploy.py --validate-only | tee results/release_validation.json
      - name: Final manifest and complete v2.0 bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path("."); files={}
          for p in sorted(root.rglob("*")):
              if p.is_file() and p.name not in {"sha256_manifest.json"} and "__pycache__" not in p.parts:
                  files[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/"results"/"sha256_manifest.json").write_text(json.dumps(files,indent=2)+"\n")
          PY
          zip -qr "Master_v2.0_complete_bundle.zip" . -x "./Master_v2.0_complete_bundle.zip"
      - name: Update indexes, remove staging payload, and publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("Theoretical Research/Burst_Robust_Codes_for_Life_and_Qubits/README.md")
          s=p.read_text()
          link="\n\n## Expanded master edition\n\n- [Master v2.0 — 31-page research manuscript, source, code, figures, results and review evidence](Master_v2.0/)\n- [Complete v2.0 bundle](Master_v2.0/Master_v2.0_complete_bundle.zip)\n"
          if "Master_v2.0" not in s: p.write_text(s.rstrip()+link)
          p=Path("Theoretical Research/Readme.md"); s=p.read_text()
          row="| 2026.11.06 | Burst-Robust Codes for Life and Qubits — Master v2.0 | Expanded 31-page theory-plus-synthetic research release | [Master v2.0](Burst_Robust_Codes_for_Life_and_Qubits/Master_v2.0/) |"
          if "Burst_Robust_Codes_for_Life_and_Qubits/Master_v2.0" not in s: p.write_text(s.rstrip()+"\n"+row+"\n")
          PY
          rm -rf ".research-staging/burst-master-v2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RELEASE" "Theoretical Research/Readme.md" "Theoretical Research/Burst_Robust_Codes_for_Life_and_Qubits/README.md" ".research-staging/burst-master-v2"
          git commit -m "publish(burst-master-v2): publish expanded 31-page master edition"
          git push origin main
