name: Build and archive Memory-Energy Frontier research release

on:
  push:
    branches: [main]
    paths:
      - ".research-staging/memory-energy/READY"

permissions:
  contents: write

concurrency:
  group: memory-energy-frontier-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: ${{ !startsWith(github.event.head_commit.message, 'publish(memory-energy-frontier):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      RELEASE_DIR: "Theoretical Research/Memory_Energy_Frontier_Spectral_Rate_Distortion_Bounds_for_Energy_Constrained_Recurrent_Inference"
      STAGING_DIR: ".research-staging/memory-energy"
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned scientific and PDF-review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy==2.3.5" "matplotlib==3.10.8" "scikit-learn==1.8.0" "networkx==3.6.1" "PyMuPDF==1.26.7" "PyYAML==6.0.3" "Pillow==11.3.0"
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended latexmk poppler-utils

      - name: Stage immutable source inputs
        shell: bash
        run: |
          set -euo pipefail
          for f in paper.tex paper.bib verify_model.py deploy.py README.md CITATION.cff .zenodo.json schema_article.jsonld INDEX_ENTRY.md finalize_research_records.py; do
            test -s "$STAGING_DIR/$f" || { echo "Missing staged input: $f" >&2; exit 1; }
          done
          test ! -e "$RELEASE_DIR" || { echo "Release path already exists; refusing overwrite." >&2; exit 1; }
          mkdir -p "$RELEASE_DIR/figures" "$RELEASE_DIR/results"
          for f in paper.tex paper.bib verify_model.py deploy.py README.md CITATION.cff .zenodo.json schema_article.jsonld; do
            cp "$STAGING_DIR/$f" "$RELEASE_DIR/$f"
          done
          cp "$STAGING_DIR/INDEX_ENTRY.md" "$RUNNER_TEMP/memory-energy-index-entry.md"
          cp "$STAGING_DIR/finalize_research_records.py" "$RELEASE_DIR/results/finalize_research_records.py"
          printf '%s\n' "Staged source files copied; figures and numerical results are generated from code."

      - name: Run numerical verification and regenerate all figure assets
        shell: bash
        run: |
          set -euo pipefail
          find "$RELEASE_DIR" -name '*.py' -print0 | xargs -0 python -m py_compile
          python "$RELEASE_DIR/verify_model.py" 2>&1 | tee "$RELEASE_DIR/results/verify_model_stdout.txt"
          test -s "$RELEASE_DIR/results/verification_report.json"
          test -s "$RELEASE_DIR/results/metrics.tex"
          test "$(find "$RELEASE_DIR/figures" -maxdepth 1 -name 'figure*.pdf' | wc -l)" -ge 8
          test "$(find "$RELEASE_DIR/figures" -maxdepth 1 -name 'figure*.svg' | wc -l)" -ge 8
          test "$(find "$RELEASE_DIR/figures" -maxdepth 1 -name 'figure*.png' | wc -l)" -ge 8

      - name: Build fresh PDF and run deployment self-tests
        shell: bash
        run: |
          set -euo pipefail
          python "$RELEASE_DIR/deploy.py" --self-test | tee "$RELEASE_DIR/results/deploy_self_test.log"
          python "$RELEASE_DIR/deploy.py" --build --review-dir "$RUNNER_TEMP/memory-energy-review" > "$RUNNER_TEMP/build_and_preflight.log" 2>&1 || { cat "$RUNNER_TEMP/build_and_preflight.log"; exit 1; }
          python "$RELEASE_DIR/results/finalize_research_records.py" "$RELEASE_DIR"
          python "$RELEASE_DIR/deploy.py" --validate-only --root "$RELEASE_DIR" > "$RUNNER_TEMP/deploy_validate_run.log" 2>&1 || { cat "$RUNNER_TEMP/deploy_validate_run.log"; exit 1; }
          rm -rf "$RELEASE_DIR/__pycache__" "$RELEASE_DIR/results/__pycache__"

      - name: Update release index without deleting existing entries
        shell: bash
        run: |
          set -euo pipefail
          python - "$RELEASE_DIR" "$RUNNER_TEMP/memory-energy-index-entry.md" <<'PY'
          import sys
          from pathlib import Path
          release = Path(sys.argv[1])
          entry = Path(sys.argv[2]).read_text(encoding="utf-8").strip()
          index = release.parent / "Readme.md"
          old = index.read_text(encoding="utf-8") if index.exists() else "# Theoretical Research\n\n"
          slug = release.name
          if slug in old:
              raise SystemExit("Release index collision detected; refusing duplicate entry.")
          index.write_text(old.rstrip() + "\n" + entry + "\n", encoding="utf-8")
          PY

      - name: Upload PDF and all page renders for independent visual review
        uses: actions/upload-artifact@v4
        with:
          name: memory-energy-frontier-pdf-review
          if-no-files-found: error
          retention-days: 14
          path: |
            Theoretical Research/Memory_Energy_Frontier_Spectral_Rate_Distortion_Bounds_for_Energy_Constrained_Recurrent_Inference/paper.pdf
            Theoretical Research/Memory_Energy_Frontier_Spectral_Rate_Distortion_Bounds_for_Energy_Constrained_Recurrent_Inference/results/pdf_contact_sheet.png
            ${{ runner.temp }}/memory-energy-review/pages/*.png

      - name: Commit release and verify remote read-back
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$STAGING_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$RELEASE_DIR" "Theoretical Research/Readme.md" "$STAGING_DIR"
          if git diff --cached --quiet; then
            echo "No release changes staged." >&2
            exit 1
          fi
          git commit -m "publish(memory-energy-frontier): build and archive research release"
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main --tags
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main || { echo "Rebase conflict; stopping without force-push." >&2; exit 1; }
            fi
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Push attempt $attempt failed; refreshing main." >&2
          done
          test "$pushed" = true
          git fetch origin main --tags
          remote_head="$(git rev-parse origin/main)"
          release_commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$release_commit" origin/main
          for f in paper.tex paper.pdf verify_model.py README.md CITATION.cff paper.bib .zenodo.json schema_article.jsonld deploy.py; do
            local_sha="$(sha256sum "$RELEASE_DIR/$f" | cut -d' ' -f1)"
            remote_sha="$(git show "origin/main:$RELEASE_DIR/$f" | sha256sum | cut -d' ' -f1)"
            test "$local_sha" = "$remote_sha" || { echo "Remote hash mismatch: $f" >&2; exit 1; }
          done
          git show "origin/main:Theoretical Research/Readme.md" | grep -Fq "Memory_Energy_Frontier_Spectral_Rate_Distortion_Bounds_for_Energy_Constrained_Recurrent_Inference"
          echo "Release commit: $release_commit" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified main head: $remote_head" >> "$GITHUB_STEP_SUMMARY"
          echo "All nine core files and the parent index were read back and hash-checked." >> "$GITHUB_STEP_SUMMARY"
