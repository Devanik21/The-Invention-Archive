name: Tag verified Alien Life research release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tag-alien-repair-release.yml"

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the archive
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create or verify the date-based release tag
        env:
          RELEASE_TAG: "v2026.10.17"
          TARGET_SHA: "76e33e4f99eab173be86f1f407933cfb7bf6469b"
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            actual="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$actual" != "$TARGET_SHA" ]]; then
              echo "Refusing to move existing tag $RELEASE_TAG: target is $actual, expected $TARGET_SHA" >&2
              exit 1
            fi
            echo "Existing tag $RELEASE_TAG already points to the verified artifact commit."
          else
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "Verified research release: Interrogating Alien Life"
            git push origin "$RELEASE_TAG"
          fi

      - name: Remove this temporary tag helper without changing release artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tag-alien-repair-release.yml
          git commit -m "cleanup(alien-repair): remove temporary tag helper"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase FETCH_HEAD
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Cleanup push attempt $attempt failed; retrying against latest main." >&2
          done
          echo "Tag was created, but temporary workflow cleanup failed." >&2
          exit 1
