name: Verify Epsilon-Nets of Antigenic Space release
on:
  push:
    branches: [main]
    paths: [".research-staging/epsilon-nets-antigenic-verify/READY"]
permissions:
  contents: read
concurrency:
  group: verify-epsilon-nets-antigenic
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE: Theoretical Research/Epsilon-Nets-of-Antigenic-Space
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install verification dependencies
        run: |
          python -m pip install numpy==2.3.5 matplotlib==3.10.8 networkx==3.6.1 PyMuPDF==1.26.7 PyYAML==6.0.3 Pillow==11.3.0
          sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Independently verify remote release on this exact main head
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE"
          python -m py_compile verify_model.py deploy.py
          python deploy.py --self-test
          python deploy.py --validate-only
          rm -rf __pycache__
          git fetch origin --tags
          git cat-file -e refs/tags/v2026.11.01^{commit}
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,fitz,re,yaml
          p=Path('.'); expected={'paper.tex','paper.pdf','verify_model.py','README.md','CITATION.cff','paper.bib','.zenodo.json','schema_article.jsonld','deploy.py'}
          assert {x.name for x in p.iterdir() if x.is_file()}==expected
          assert {x.name for x in p.iterdir() if x.is_dir()}=={'figures','results'}
          yaml.safe_load((p/'CITATION.cff').read_text()); json.loads((p/'.zenodo.json').read_text()); json.loads((p/'schema_article.jsonld').read_text())
          d=fitz.open('paper.pdf'); texts=[x.get_text() for x in d]
          st=next(i for i,t in enumerate(texts) if 'A broad-spectrum antibody cocktail is a finite set' in t)
          en=next(i for i,t in enumerate(texts) if 'Research-process credit and disclosure' in t)
          assert len(d)>=25 and en-st+1>=18
          full='\n'.join(texts); assert len(re.findall(r'Figure\s+\d+:',full))>=12 and len(re.findall(r'Table\s+\d+:',full))>=5
          assert len(list((p/'figures').glob('*.pdf')))>=12 and len(list((p/'figures').glob('*.svg')))>=12
          review=json.loads((p/'results/pdf_visual_review.json').read_text()); digest=hashlib.sha256((p/'paper.pdf').read_bytes()).hexdigest()
          assert review['pdf_sha256']==digest and review['page_count']==len(d)
          for name,h in json.loads((p/'results/sha256_manifest.json').read_text())['files'].items():
              f=p/name; assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==h,name
          readme=(p/'README.md').read_text(); assert readme.count('$$')%2==0 and '\\operatorname' not in readme
          assert 'Epsilon-Nets-of-Antigenic-Space' in (p.parent/'Readme.md').read_text()
          print(f'PASS exact-head remote validation: pages={len(d)}, main_text={en-st+1}, pdf_sha256={digest}')
          PY
          pdfinfo paper.pdf
          pdffonts paper.pdf
          echo "Verified main head $GITHUB_SHA and tag v2026.11.01"