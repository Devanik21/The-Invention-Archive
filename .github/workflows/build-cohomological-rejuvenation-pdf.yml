name: Build Cohomological Rejuvenation PDF
on:
  push:
    branches: [main]
    paths:
      - 'Theoretical Research/Cohomological_Rejuvenation_Tissues_That_Heal_Their_Own_Incoherence/paper.tex'
      - 'Theoretical Research/Cohomological_Rejuvenation_Tissues_That_Heal_Their_Own_Incoherence/paper.bib'
      - '.github/workflows/build-cohomological-rejuvenation-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier and TeX dependencies
        run: |
          python -m pip install "numpy>=2,<3" PyYAML
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Verify model, metadata, essay, thread, and PDF
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="Theoretical Research/Cohomological_Rejuvenation_Tissues_That_Heal_Their_Own_Incoherence"
          BUILD_DIR="$(mktemp -d)"
          trap 'rm -rf "$BUILD_DIR"' EXIT
          python "$RELEASE_DIR/verify_model.py"
          python - "$RELEASE_DIR" <<'PY'
          import json, pathlib, re, sys, yaml
          d = pathlib.Path(sys.argv[1])
          json.loads((d / ".zenodo.json").read_text(encoding="utf-8"))
          json.loads((d / "schema_article.jsonld").read_text(encoding="utf-8"))
          yaml.safe_load((d / "CITATION.cff").read_text(encoding="utf-8"))
          words = (d / "medium_story.md").read_text(encoding="utf-8").split()
          assert 1500 <= len(words) <= 2000, f"Medium word count outside 1500–2000: {len(words)}"
          thread = (d / "x_thread.md").read_text(encoding="utf-8")
          posts = re.findall(r"^\*\*\d+/12\*\*", thread, flags=re.M)
          assert len(posts) == 12, f"Expected 12 X posts, found {len(posts)}"
          print(f"Metadata valid; Medium words={len(words)}; X posts={len(posts)}")
          PY
          cp "$RELEASE_DIR/paper.tex" "$BUILD_DIR/paper.tex"
          cp "$RELEASE_DIR/paper.bib" "$BUILD_DIR/paper.bib"
          cd "$BUILD_DIR"
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          test -s paper.pdf
          python -c "from pathlib import Path; p=Path('paper.pdf'); assert p.read_bytes()[:5] == b'%PDF-', 'invalid PDF signature'; print(f'Compiled PDF: {p.stat().st_size} bytes')"
          cd "$GITHUB_WORKSPACE"
          cp "$BUILD_DIR/paper.pdf" "$RELEASE_DIR/paper.pdf"
          python - "$RELEASE_DIR" <<'PY'
          import pathlib, sys
          d = pathlib.Path(sys.argv[1])
          expected = {
              "paper.tex", "paper.pdf", "verify_model.py", "README.md",
              "medium_story.md", "x_thread.md", "CITATION.cff", "paper.bib",
              ".zenodo.json", "schema_article.jsonld", "deploy.py"
          }
          actual = {p.name for p in d.iterdir() if p.is_file()}
          assert actual == expected, f"Expected exactly 11 core files; missing={expected-actual}, extra={actual-expected}"
          assert all((d / n).stat().st_size > 0 for n in expected), "Empty release artifact"
          print("Release manifest valid: exactly 11 nonempty core files")
          PY
      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Theoretical Research/Cohomological_Rejuvenation_Tissues_That_Heal_Their_Own_Incoherence/paper.pdf"
          if git diff --cached --quiet; then
            echo "Compiled PDF is already current."
          else
            git commit -m "Build Cohomological Rejuvenation PDF"
            git push origin HEAD:main
          fi

      - name: Create and verify semantic tag
        env:
          RELEASE_TAG: "v2026.10.11"
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          git tag -a "$RELEASE_TAG" -m "Cohomological Rejuvenation preprint $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          git fetch origin --tags
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          echo "Verified annotated tag $RELEASE_TAG -> $(git rev-parse HEAD)"
