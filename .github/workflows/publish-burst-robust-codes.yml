name: Publish burst-robust research release
on:
  push:
    branches: [research/burst-robust-codes-2026, main]
    paths:
      - "Theoretical Research/Burst_Robust_Codes_for_Life_and_Qubits/**"
      - ".github/workflows/publish-burst-robust-codes.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: burst-robust-release
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'publish(burst-robust): build manuscript and reproducible release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: |
          python -m pip install numpy==2.3.5 pandas==2.3.3 matplotlib==3.10.8
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-latex-extra texlive-fonts-recommended poppler-utils zip
      - name: Reproduce benchmark and compile manuscript
        env:
          RELEASE: "Theoretical Research/Burst_Robust_Codes_for_Life_and_Qubits"
        run: |
          set -euo pipefail
          cd "$RELEASE"
          python verify_model.py | tee results/verification_stdout.txt
          pandoc paper.md -o paper.pdf --pdf-engine=pdflatex -V geometry:margin=0.8in
          pdfinfo paper.pdf
          test "$(pdfinfo paper.pdf | awk '/^Pages:/ {print $2}')" -ge 5
          test -s figures/figure1_spanning_threshold.pdf
          test -s results/spanning_sweep.csv
          sha256sum paper.pdf paper.md verify_model.py > results/sha256_manifest.txt
      - name: Build bundle and update index
        env:
          RELEASE: "Theoretical Research/Burst_Robust_Codes_for_Life_and_Qubits"
        run: |
          set -euo pipefail
          zip -qr "Theoretical Research/Burst_Robust_Codes_for_Life_and_Qubits_complete_bundle.zip" "$RELEASE"
          python - <<'PY'
          from pathlib import Path
          p=Path("Theoretical Research/Readme.md"); s=p.read_text()
          row="| 2026.11.06 | Burst-Robust Codes for Life and Qubits | Correlated-burst reliability theory + synthetic benchmark | [Burst-Robust Codes for Life and Qubits](Burst_Robust_Codes_for_Life_and_Qubits/) |"
          if row not in s: p.write_text(s.rstrip()+"\n\n"+row+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$RELEASE" "Theoretical Research/Readme.md" "Theoretical Research/Burst_Robust_Codes_for_Life_and_Qubits_complete_bundle.zip"
          git commit -m "publish(burst-robust): build manuscript and reproducible release" || exit 0
          git push
