name: Build and archive Silica Light Meters research release

on:
  push:
    branches: [main]
    paths:
      - ".research-staging/silica-light-meters/READY"

permissions:
  contents: write

concurrency:
  group: silica-light-meters-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: ${{ !startsWith(github.event.head_commit.message, 'publish(silica-light-meters):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_DIR: "Theoretical Research/Silica_Light_Meters_Physics_Constrained_Inverse_Learning_of_Past_Underwater_Light_Regimes_from_Diatom_Frustule_Photonic_Crystals"
      STAGING_DIR: ".research-staging/silica-light-meters"
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reproducibility and PDF-review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy>=2.0,<3" "matplotlib>=3.7" "networkx>=3.0" "PyMuPDF>=1.23" "PyYAML>=6.0" "Pillow>=10"
          sudo apt-get update
          sudo apt-get install -y xz-utils poppler-utils

      - name: Restore and run version-controlled release generator
        shell: bash
        run: |
          set -euo pipefail
          test -s "$STAGING_DIR/builder_xz.b64.part00"
          cat "$STAGING_DIR"/builder_xz.b64.part* | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/builder.py.xz"
          xz -t "$RUNNER_TEMP/builder.py.xz"
          xz -dc "$RUNNER_TEMP/builder.py.xz" > "$RUNNER_TEMP/build_release.py"
          python -m py_compile "$RUNNER_TEMP/build_release.py"
          test ! -e "$RELEASE_DIR" || { echo "Release path already exists; refusing overwrite." >&2; exit 1; }
          mkdir -p "$RELEASE_DIR"
          python "$RUNNER_TEMP/build_release.py" --release-dir "$RELEASE_DIR" --generate-only | tee "$RUNNER_TEMP/generator_stdout.json"
          cp "$RUNNER_TEMP/generator_stdout.json" "$RELEASE_DIR/results/build_generation_summary.json"
          test -s "$RELEASE_DIR/paper.tex"
          test -s "$RELEASE_DIR/paper.bib"
          test -s "$RELEASE_DIR/verify_model.py"
          test ! -s "$RELEASE_DIR/paper.pdf"

      - name: Compile LaTeX manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper.tex
          working_directory: "Theoretical Research/Silica_Light_Meters_Physics_Constrained_Inverse_Learning_of_Past_Underwater_Light_Regimes_from_Diatom_Frustule_Photonic_Crystals"
          latexmk_use_xelatex: false

      - name: Validate release and prepare review artifacts
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          find "$RELEASE_DIR" -maxdepth 1 -type f \( -name '*.aux' -o -name '*.bbl' -o -name '*.bcf' -o -name '*.blg' -o -name '*.fdb_latexmk' -o -name '*.fls' -o -name '*.lof' -o -name '*.log' -o -name '*.lot' -o -name '*.out' -o -name '*.run.xml' -o -name '*.synctex.gz' -o -name '*.toc' -o -name '*.upa' -o -name '*.xdv' \) -delete
          python "$RELEASE_DIR/verify_model.py" > "$RELEASE_DIR/results/verification_run.log" 2>&1
          python -m py_compile "$RELEASE_DIR/verify_model.py" "$RELEASE_DIR/deploy.py"
          python "$RELEASE_DIR/deploy.py" --self-test > "$RELEASE_DIR/results/deploy_self_test.log" 2>&1
          rm -rf "$RELEASE_DIR/__pycache__"
          python - "$RELEASE_DIR" "$RUNNER_TEMP/silica_pdf_review" <<'PY'
          import hashlib, json, math, os, re, sys, yaml
          from datetime import datetime, timezone
          from pathlib import Path
          import fitz
          from PIL import Image, ImageDraw
          root=Path(sys.argv[1]); review_dir=Path(sys.argv[2]); pages_dir=review_dir/'pages'
          pages_dir.mkdir(parents=True, exist_ok=True)
          core={"paper.tex","paper.pdf","verify_model.py","README.md","CITATION.cff","paper.bib",".zenodo.json","schema_article.jsonld","deploy.py"}
          root_files={p.name for p in root.iterdir() if p.is_file()}
          assert root_files==core, f"root-level core-file mismatch: missing={sorted(core-root_files)} extra={sorted(root_files-core)}"
          assert (root/'figures').is_dir() and (root/'results').is_dir()
          assert len(list((root/'figures').glob('*.pdf'))) >= 8
          assert len(list((root/'figures').glob('*.png'))) >= 8
          tex=(root/'paper.tex').read_text(encoding='utf-8'); bib=(root/'paper.bib').read_text(encoding='utf-8')
          assert tex.count(r'\begin{table}') >= 5
          assert tex.count(r'\begin{figure}') >= 8
          keys=set(re.findall(r'@\w+\s*\{\s*([^,]+)',bib))
          citations=[]
          for block in re.findall(r'\\cite\w*\{([^}]+)\}',tex): citations.extend(x.strip() for x in block.split(','))
          missing=sorted(set(citations)-keys)
          assert not missing, f"unresolved BibTeX keys: {missing}"
          yaml.safe_load((root/'CITATION.cff').read_text(encoding='utf-8'))
          json.loads((root/'.zenodo.json').read_text(encoding='utf-8'))
          json.loads((root/'schema_article.jsonld').read_text(encoding='utf-8'))
          doc=fitz.open(root/'paper.pdf'); page_count=len(doc)
          text_chars=sum(len(page.get_text()) for page in doc)
          assert page_count >= 7 and text_chars >= 12000, (page_count,text_chars)
          thumbs=[]
          for idx,page in enumerate(doc,1):
              pix=page.get_pixmap(matrix=fitz.Matrix(150/72,150/72), alpha=False)
              target=pages_dir/f'page-{idx:02d}.png'; pix.save(target)
              im=Image.open(target).convert('RGB'); im.thumbnail((255,360))
              card=Image.new('RGB',(275,395),'white'); card.paste(im,((275-im.width)//2,22))
              ImageDraw.Draw(card).text((10,5),f'Page {idx:02d}',fill='black'); thumbs.append(card)
          cols=3; rows=math.ceil(len(thumbs)/cols)
          sheet=Image.new('RGB',(cols*275,rows*395),(225,225,225))
          for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*275,(i//cols)*395))
          sheet.save(root/'results'/'pdf_contact_sheet.png')
          digest=hashlib.sha256((root/'paper.pdf').read_bytes()).hexdigest()
          review={"status":"PENDING_REMOTE_VISUAL_INSPECTION","pdf_sha256":digest,"page_count":page_count,"render_dpi":150,"rendered_pages":list(range(1,page_count+1)),"pages_reviewed":[],"inspection_timestamp_utc":datetime.now(timezone.utc).isoformat(),"inspection_method":"CI rendered every page; independent page-by-page visual review of this exact remote PDF is still pending.","automated_checks":{"pdf_parses":True,"page_count_verified":True,"extracted_text_characters":text_chars,"font_and_vector_review":"pending independent review","table_environments":tex.count(r'\begin{table}'),"figure_environments":tex.count(r'\begin{figure}')},"issues":[{"severity":"pending","issue":"Exact remote PDF requires independent visual inspection.","remediation":"Review uploaded page renders and update this record against the exact PDF SHA-256."}],"final_disposition":"Not marked publication-quality PASS until independent inspection closes."}
          (root/'results'/'pdf_visual_review.json').write_text(json.dumps(review,indent=2)+'\n',encoding='utf-8')
          quality=f"""# Publication-quality report\n\n**Status: BLOCKED pending independent visual inspection of the exact CI-built PDF.**\n\n- SHA-256: `{digest}`\n- Pages: {page_count}; extracted text characters: {text_chars}\n- Table environments: {tex.count(r'\\begin{table}')} (required at least 5)\n- Figure environments: {tex.count(r'\\begin{figure}')} (required at least 8)\n- Every page was rendered at 150 dpi. Contact sheet: `pdf_contact_sheet.png`; full page renders are stored as an Actions artifact.\n- Synthetic/model-generated data only: no measured species preferences, RCWA/FDTD spectra, or sediment-core observations. No empirical or paleoclimate validation is claimed.\n"""
          (root/'results'/'publication_quality_report.md').write_text(quality,encoding='utf-8')
          (root/'results'/'remote_deployment_status.md').write_text(f"# Remote build provenance\n\n- Triggering source commit: {os.environ['SOURCE_COMMIT']}\n- Workflow run: {os.environ['RUN_URL']}\n- Manuscript and bibliography were compiled from the staged source; PDF parsed and rendered for review.\n- Scope: synthetic/model-generated checks only; no empirical ecological or paleoclimate validation.\n- Remote visual gate: pending review of the exact CI-produced PDF.\n",encoding='utf-8')
          parent=root.parent; index=parent/'Readme.md'; entry=(parent/'Theoretical_Research_index_entry.md').read_text(encoding='utf-8').strip()
          old=index.read_text(encoding='utf-8') if index.exists() else '# Theoretical Research\n\n'
          slug='Silica_Light_Meters_Physics_Constrained_Inverse_Learning_of_Past_Underwater_Light_Regimes_from_Diatom_Frustule_Photonic_Crystals'
          if slug not in old: index.write_text(old.rstrip()+'\n'+entry+'\n',encoding='utf-8')
          else: raise SystemExit('Release already exists in index; refusing duplicate entry')
          (parent/'Theoretical_Research_index_entry.md').unlink(missing_ok=True)
          checks=[
            {"name":"LaTeX build and PDF preflight","status":"PASS","evidence":"paper.pdf and build log","details":f"{page_count} pages; {text_chars} extracted characters."},
            {"name":"Synthetic verification","status":"PASS","evidence":"results/verification_run.log","details":"Synthetic checks only."},
            {"name":"Python syntax and deployment self-test","status":"PASS","evidence":"results/deploy_self_test.log","details":"Source syntax and invalid-input fixture tested."},
            {"name":"Citation and metadata syntax","status":"PASS","evidence":"paper.bib; CITATION.cff; JSON metadata","details":"Parser checks passed."},
            {"name":"Root manifest and supporting evidence","status":"PASS","evidence":"GitHub Actions build job","details":"Nine core root files and evidence directories verified."},
            {"name":"Post-commit read-back and terminal Actions state","status":"PENDING","evidence":os.environ['RUN_URL'],"details":"Must be confirmed after push."},
            {"name":"Page-by-page visual review","status":"PENDING","evidence":"results/pdf_visual_review.json and uploaded artifact","details":"Every page rendered; no independent visual gate asserted."},
            {"name":"Version tag target","status":"PENDING","evidence":"separate reviewed-release tag workflow","details":"Tag stays blocked until all required gates pass."}
          ]
          matrix={"release_status":"BLOCKED","generated_at_utc":datetime.now(timezone.utc).isoformat(),"repository":"Devanik21/The-Invention-Archive","target_branch":"main","release_version":"v2026.10.18","pdf_sha256":digest,"pdf_pages":page_count,"source_commit":os.environ['SOURCE_COMMIT'],"checks":checks,"blockers":["Independent visual inspection of exact remote PDF","Post-commit read-back and terminal run-state verification"],"closure_rule":"Set PASS only after page-by-page visual review of this PDF hash and post-commit remote read-back; a CI build alone is not final sign-off."}
          (root/'results'/'release_check_matrix.json').write_text(json.dumps(matrix,indent=2)+'\n',encoding='utf-8')
          PY
          python "$RELEASE_DIR/deploy.py" --validate-only --root "$RELEASE_DIR" > "$RELEASE_DIR/results/deploy_validate_run.log" 2>&1
          rm -rf "$RELEASE_DIR/__pycache__"
          python - "$RELEASE_DIR" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='sha256_manifest.json' and '__pycache__' not in p.parts}
          (root/'results'/'sha256_manifest.json').write_text(json.dumps({"algorithm":"sha256","files":manifest},indent=2)+'\n',encoding='utf-8')
          expected={"paper.tex","paper.pdf","verify_model.py","README.md","CITATION.cff","paper.bib",".zenodo.json","schema_article.jsonld","deploy.py"}
          actual={p.name for p in root.iterdir() if p.is_file()}
          assert actual==expected,(sorted(expected-actual),sorted(actual-expected))
          assert all(p.stat().st_size>0 for p in root.iterdir() if p.is_file())
          print(f"PASS: final release has {len(actual)} core files and {len(manifest)} hashes.")
          PY

      - name: Upload PDF and rendered pages for independent review
        uses: actions/upload-artifact@v4
        with:
          name: silica-light-meters-remote-pdf-review
          if-no-files-found: error
          retention-days: 14
          path: |
            Theoretical Research/Silica_Light_Meters_Physics_Constrained_Inverse_Learning_of_Past_Underwater_Light_Regimes_from_Diatom_Frustule_Photonic_Crystals/paper.pdf
            Theoretical Research/Silica_Light_Meters_Physics_Constrained_Inverse_Learning_of_Past_Underwater_Light_Regimes_from_Diatom_Frustule_Photonic_Crystals/results/pdf_contact_sheet.png
            ${{ runner.temp }}/silica_pdf_review/pages/*.png

      - name: Commit release, update index, and verify remote hashes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch -- "$STAGING_DIR"
          git add -- "$RELEASE_DIR" "Theoretical Research/Readme.md"
          if git diff --cached --quiet; then echo "No release changes staged." >&2; exit 1; fi
          git commit -m "publish(silica-light-meters): build and archive research release"
          # Container-based LaTeX compilation may leave tracked filesystem metadata dirty.
          if ! git diff --quiet; then
            git add -u -- "$RELEASE_DIR" "Theoretical Research/Readme.md"
            git commit --amend --no-edit
          fi
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main --tags
            # A rebase is needed only if main moved beyond this commit's parent.
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git stash push -u -m "temporary Silica Light Meters workspace before rebase"
              git rebase origin/main
              git stash pop
              if ! git diff --quiet; then
                git add -u -- "$RELEASE_DIR" "Theoretical Research/Readme.md"
                git commit --amend --no-edit
              fi
            fi
            if git push origin HEAD:main; then pushed=true; break; fi
            echo "Push attempt $attempt failed; refreshing main." >&2
          done
          test "$pushed" = true
          git fetch origin main --tags
          remote_head="$(git rev-parse origin/main)"
          release_commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$release_commit" origin/main
          for f in paper.tex paper.pdf verify_model.py README.md CITATION.cff paper.bib .zenodo.json schema_article.jsonld deploy.py; do
            local_sha="$(sha256sum "$RELEASE_DIR/$f" | cut -d' ' -f1)"
            remote_sha="$(git show "origin/main:$RELEASE_DIR/$f" | sha256sum | cut -d' ' -f1)"
            test "$local_sha" = "$remote_sha" || { echo "Remote hash mismatch: $f" >&2; exit 1; }
          done
          git show "origin/main:Theoretical Research/Readme.md" | grep -Fq "Silica_Light_Meters_Physics_Constrained_Inverse_Learning_of_Past_Underwater_Light_Regimes_from_Diatom_Frustule_Photonic_Crystals"
          echo "PASS: published release commit $release_commit; verified main head $remote_head; nine core-file hashes and index row read back." >> "$GITHUB_STEP_SUMMARY"
