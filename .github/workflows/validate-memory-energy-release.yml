name: Validate Memory-Energy Frontier release and tag

on:
  push:
    branches: [main]
    paths:
      - "Theoretical Research/Memory_Energy_Frontier_Spectral_Rate_Distortion_Bounds_for_Energy_Constrained_Recurrent_Inference/results/release_check_matrix.json"

permissions:
  contents: write

concurrency:
  group: memory-energy-frontier-validation
  cancel-in-progress: false

jobs:
  validate-final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_DIR: "Theoretical Research/Memory_Energy_Frontier_Spectral_Rate_Distortion_Bounds_for_Energy_Constrained_Recurrent_Inference"
      RELEASE_TAG: "v2026.10.24"
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy==2.3.5" "matplotlib==3.10.8" "scikit-learn==1.8.0" "networkx==3.6.1" "PyMuPDF==1.26.7" "PyYAML==6.0.3" "Pillow==11.3.0"
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended latexmk poppler-utils

      - name: Re-run model checks in an isolated copy
        shell: bash
        run: |
          set -euo pipefail
          CHECK_DIR="$RUNNER_TEMP/memory-energy-recheck"
          mkdir -p "$CHECK_DIR"
          cp -a "$RELEASE_DIR/." "$CHECK_DIR/"
          find "$CHECK_DIR" -name '*.py' -print0 | xargs -0 python -m py_compile
          find "$CHECK_DIR" -type d -name __pycache__ -prune -exec rm -rf {} +
          python "$CHECK_DIR/verify_model.py" > "$RUNNER_TEMP/verify_model_recheck.log" 2>&1
          for f in results/model_outputs.csv results/sensitivity_sweep.csv results/metrics.tex results/frontier_data.csv results/figure_curve_data.csv results/numerical_summary.json results/verification_report.json; do
            cmp "$RELEASE_DIR/$f" "$CHECK_DIR/$f" || { echo "Deterministic output mismatch: $f" >&2; exit 1; }
          done
          python "$RELEASE_DIR/deploy.py" --validate-only --root "$RELEASE_DIR" > "$RUNNER_TEMP/deploy_validate.log" 2>&1 || { cat "$RUNNER_TEMP/deploy_validate.log"; exit 1; }

      - name: Validate exact PDF, metadata, manifest, and matrix
        shell: bash
        run: |
          set -euo pipefail
          python - "$RELEASE_DIR" "$RELEASE_TAG" <<'PY'
          import hashlib, json, re, sys, yaml
          from pathlib import Path
          import fitz
          root=Path(sys.argv[1]); tag=sys.argv[2]
          expected={"paper.tex","paper.pdf","verify_model.py","README.md","CITATION.cff","paper.bib",".zenodo.json","schema_article.jsonld","deploy.py"}
          actual={p.name for p in root.iterdir() if p.is_file()}
          assert actual==expected, (sorted(expected-actual), sorted(actual-expected))
          matrix=json.loads((root/"results/release_check_matrix.json").read_text(encoding="utf-8"))
          review=json.loads((root/"results/pdf_visual_review.json").read_text(encoding="utf-8"))
          quality=json.loads((root/"results/publication_quality_report.json").read_text(encoding="utf-8"))
          digest=hashlib.sha256((root/"paper.pdf").read_bytes()).hexdigest()
          doc=fitz.open(root/"paper.pdf")
          assert matrix.get("release_status")=="PASS", "release matrix is not PASS"
          assert all(x.get("status")=="PASS" for x in matrix.get("checks",[])), "matrix contains non-PASS checks"
          assert review.get("status")=="PASS" and review.get("pdf_sha256")==digest, "visual review does not bind to final PDF"
          assert review.get("pages_reviewed")==list(range(1,len(doc)+1)), "not every PDF page is recorded as reviewed"
          assert quality.get("status")=="PASS" and quality.get("pdf_sha256")==digest, "publication-quality report hash/status mismatch"
          assert len(doc)>=7 and sum(len(p.get_text()) for p in doc)>=8000
          tex=(root/"paper.tex").read_text(encoding="utf-8"); bib=(root/"paper.bib").read_text(encoding="utf-8")
          assert len(re.findall(r"\\begin\{table\}",tex))>=5
          assert len(re.findall(r"\\begin\{figure\}",tex))>=8
          keys=set(re.findall(r"@\w+\s*\{\s*([^,]+)",bib))
          cites=[]
          for block in re.findall(r"\\cite\w*\{([^}]+)\}",tex): cites += [x.strip() for x in block.split(",")]
          assert not set(cites)-keys, sorted(set(cites)-keys)
          yaml.safe_load((root/"CITATION.cff").read_text(encoding="utf-8"))
          json.loads((root/".zenodo.json").read_text(encoding="utf-8"))
          json.loads((root/"schema_article.jsonld").read_text(encoding="utf-8"))
          assert (root/"results/sha256_manifest.txt").is_file()
          print(f"PASS: {len(expected)} core files, {len(doc)} pages, PDF SHA-256 {digest}")
          PY

      - name: Create semantic tag only after all acceptance gates pass
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_sha="$(git rev-parse HEAD)"
          remote_head="$(git rev-parse origin/main)"
          test "$head_sha" = "$remote_head" || { echo "main advanced during validation; refusing to tag a stale head." >&2; exit 1; }
          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$tag_sha" = "$head_sha" || { echo "Tag already exists at a different commit; refusing to move it." >&2; exit 1; }
          else
            git tag -a "$RELEASE_TAG" -m "Reviewed Memory-Energy Frontier research release"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          resolved="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$resolved" = "$head_sha"
          echo "Validated final SHA: $head_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag $RELEASE_TAG resolves to: $resolved" >> "$GITHUB_STEP_SUMMARY"
          echo "All required gates passed on the triggering commit." >> "$GITHUB_STEP_SUMMARY"
