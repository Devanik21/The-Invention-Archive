name: Publish Hodge Obstruction preprint
on:
  push:
    branches: [main]
    paths:
      - ".research-staging/hodge-obstruction/READY"
permissions:
  contents: write
  actions: write
concurrency:
  group: hodge-obstruction-publication
  cancel-in-progress: false
jobs:
  build-and-publish:
    if: ${{ !contains(github.event.head_commit.message, 'publish(hodge-obstruction)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STAGING: ".research-staging/hodge-obstruction"
      RELEASE: "Theoretical Research/The_Hodge_Obstruction_to_Escape_Proof_Therapy"
      INDEX: "Theoretical Research/Readme.md"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned research and PDF toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy==2.3.5" "matplotlib==3.10.8" "networkx==3.6.1" "PyMuPDF==1.26.7" "PyYAML==6.0.3" "Pillow==11.3.0"
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Reconstruct and check payload
        shell: bash
        run: |
          set -euo pipefail
          test -s "$STAGING/READY"
          mkdir -p "$RUNNER_TEMP/hodge-payload"
          cat "$STAGING"/payload/*.b64 > "$RUNNER_TEMP/hodge-payload.tar.xz.b64"
          base64 --decode "$RUNNER_TEMP/hodge-payload.tar.xz.b64" > "$RUNNER_TEMP/hodge-payload.tar.xz"
          tar -xJf "$RUNNER_TEMP/hodge-payload.tar.xz" -C "$RUNNER_TEMP/hodge-payload"
          for f in paper.tex paper.bib verify_model.py README.md CITATION.cff .zenodo.json schema_article.jsonld deploy.py; do
            test -s "$RUNNER_TEMP/hodge-payload/$f" || { echo "Payload missing $f" >&2; exit 1; }
          done
          test ! -e "$RELEASE"
          test -s "$INDEX"
          python - "$RUNNER_TEMP/hodge-payload" <<'PY'
          import json, pathlib, sys, yaml
          p=pathlib.Path(sys.argv[1])
          json.loads((p/'.zenodo.json').read_text())
          assert json.loads((p/'schema_article.jsonld').read_text()).get('@type')=='ScholarlyArticle'
          yaml.safe_load((p/'CITATION.cff').read_text())
          print('Payload and metadata syntax: PASS')
          PY
      - name: Restore research sources into isolated release directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE/figures" "$RELEASE/results"
          cp "$RUNNER_TEMP/hodge-payload/"{paper.tex,paper.bib,verify_model.py,README.md,CITATION.cff,.zenodo.json,schema_article.jsonld,deploy.py} "$RELEASE/"
          cp -a "$RUNNER_TEMP/hodge-payload/results/." "$RELEASE/results/"
          (cd "$RELEASE" && python -m py_compile verify_model.py deploy.py && python deploy.py --self-test)
      - name: Independently verify model, rebuild PDF, and preflight all artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE"
          python verify_model.py > results/verify_model_stdout.txt 2>&1
          python deploy.py --build > results/deployment_build_stdout.txt 2>&1
          python - <<'PY'
          import json, pathlib, subprocess, hashlib, os, sys
          from PIL import Image, ImageOps, ImageDraw
          root=pathlib.Path('.')
          facts=json.loads((root/'results/deployment_build_stdout.txt').read_text().splitlines()[-1]) if False else None
          import fitz
          pdf=root/'paper.pdf'
          doc=fitz.open(pdf)
          assert doc.page_count >= 25, doc.page_count
          full='\n'.join(p.get_text() for p in doc)
          first=next(i for i,p in enumerate(doc) if 'Introduction: from drug sequences to safety' in p.get_text() and 'Antimicrobial resistance is an evolutionary control problem' in p.get_text())
          last=next(i for i,p in enumerate(doc) if 'Research-process credit and disclosure' in p.get_text())
          main=last-first+1
          assert main >= 18, main
          rows=list(__import__('csv').DictReader((root/'results/figure_inventory.csv').open()))
          assert len(rows)>=12
          kinds=[r.get('kind','').lower() for r in rows]
          assert kinds.count('plot')>=6 and kinds.count('graph')>=2 and kinds.count('flow')>=2, kinds
          assert len(list((root/'figures').glob('fig*.pdf')))>=12 and len(list((root/'figures').glob('fig*.png')))>=12
          assert len(__import__('re').findall(r'\\begin\{table\*?\}',(root/'paper.tex').read_text()))>=5
          subprocess.run(['pdfinfo','paper.pdf'],check=True,stdout=(root/'results/pdfinfo.txt').open('w'))
          subprocess.run(['pdffonts','paper.pdf'],check=True,stdout=(root/'results/pdffonts_report.txt').open('w'))
          subprocess.run(['pdftotext','-layout','paper.pdf','results/pdf_text_extract.txt'],check=True)
          env={'timestamp_utc':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),'python':sys.version,'pdf_pages':doc.page_count,'main_text_pages':main}
          try:
            import numpy, matplotlib, networkx, fitz, yaml, PIL
            env.update({'numpy':numpy.__version__,'matplotlib':matplotlib.__version__,'networkx':networkx.__version__,'PyMuPDF':fitz.VersionBind,'PyYAML':yaml.__version__,'Pillow':PIL.__version__})
          except Exception as e: env['dependency_probe_error']=str(e)
          (root/'results/environment_report.json').write_text(json.dumps(env,indent=2)+'\n')
          # Preserve the honest state: a renderer cannot certify visual quality by itself.
          import hashlib
          sha=hashlib.sha256(pdf.read_bytes()).hexdigest()
          review={'status':'RENDERED_PENDING_MANUAL_REVIEW','inspection_timestamp_utc':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),'paper_pdf_sha256':sha,'page_count':doc.page_count,'render_dpi':120,'all_pages_rendered':True,'pages_rendered':list(range(1,doc.page_count+1)),'pages_individually_reviewed':[],'contact_sheet_reviewed':False,'reviewer':'pending manual remote review','review_method':'Automated render only; no manual visual pass is inferred.','issues':[],'critical_or_major_defects':[],'final_disposition':'BLOCKED until every rendered page is inspected and the final PDF hash is reviewed.'}
          (root/'results/pdf_pages').mkdir(exist_ok=True)
          for pno,page in enumerate(doc,1):
            pix=page.get_pixmap(matrix=fitz.Matrix(120/72,120/72),alpha=False)
            pix.save(root/f'results/pdf_pages/page-{pno:02d}.png')
          imgs=[]
          for pno in range(1,doc.page_count+1):
            im=Image.open(root/f'results/pdf_pages/page-{pno:02d}.png').convert('RGB')
            im.thumbnail((190,250))
            tile=Image.new('RGB',(210,280),'white'); tile.paste(im,((210-im.width)//2,5))
            ImageDraw.Draw(tile).text((8,260),f'Page {pno:02d}',fill='black')
            imgs.append(tile)
          cols=4; rowsn=(len(imgs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*210,rowsn*280),(232,235,240))
          for i,im in enumerate(imgs): sheet.paste(im,((i%cols)*210,(i//cols)*280))
          sheet.save(root/'results/pdf_contact_sheet.jpg',quality=92)
          (root/'results/pdf_visual_review.json').write_text(json.dumps(review,indent=2)+'\n')
          quality='''# Publication-quality report\n\n**Status: BLOCKED pending manual review of the exact compiled PDF.** Automated preflight does not certify page-level visual quality.\n\n'''
          tex_source=(root/'paper.tex').read_text()
          table_count=tex_source.count(chr(92)+'begin{table}')+tex_source.count(chr(92)+'begin{table*}')
          quality+=f'- PDF SHA-256: {sha}\n- Total pages: {doc.page_count}\n- Substantive main-text pages: {main}\n- Distinct numbered figures inventoried: {len(rows)}\n- Tables in LaTeX source: {table_count}\n\n'
          quality+='''## Evidence-based scorecard\n\n| Dimension | Score | Evidence / disposition |\n|---|---:|---|\n| First-page hierarchy | PENDING | Manual review of the exact final PDF required. |\n| Typography and mathematical legibility | PENDING | Manual review of all rendered pages required. |\n| Design consistency | PENDING | Contact sheet and page-level inspection required. |\n| Table quality | PENDING | Inspect all table pages. |\n| Figure/diagram clarity | PENDING | Inspect all plot, graph, and flow pages. |\n| Page rhythm and whitespace | PENDING | Inspect every page. |\n| Section/navigation structure | PENDING | Contents/navigation review required. |\n| Overall editorial polish | PENDING | Manual review required. |\n'''
          (root/'results/publication_quality_report.md').write_text(quality)
          checks=[
            {'name':'Scientific/model checks','status':'PASS','evidence':'results/verification_report.json; results/verify_model_stdout.txt'},
            {'name':'Python syntax and deployment self-test','status':'PASS','evidence':'deployment_build_stdout.txt and self-test output in Actions'},
            {'name':'Clean LaTeX build from current source','status':'PASS','evidence':'results/latex_build_stdout.txt and results/latex_build_log.txt'},
            {'name':'PDF page floors','status':'PASS','evidence':'results/pdfinfo.txt; results/pdf_text_extract.txt'},
            {'name':'Figure and table inventory','status':'PASS','evidence':'results/figure_inventory.csv; figures/'},
            {'name':'Metadata and bibliography preflight','status':'PASS','evidence':'CITATION.cff; paper.bib; JSON metadata'},
            {'name':'PDF visual inspection/publication-quality gate','status':'BLOCKED','evidence':'results/pdf_visual_review.json; manual review pending'},
            {'name':'Remote independent verification','status':'PENDING','evidence':'verification workflow to follow the publish commit'}
          ]
          matrix={'schema_version':'1.0','execution_timestamp_utc':env.get('timestamp_utc'),'repository':'Devanik21/The-Invention-Archive','target_branch':'main','release_slug':'The_Hodge_Obstruction_to_Escape_Proof_Therapy','release_status':'BLOCKED','release_artifact_commit_sha':None,'final_head_sha':None,'pdf_sha256':sha,'pdf_pages':doc.page_count,'main_text_pages':main,'figure_inventory':{'total':len(rows),'plot':kinds.count('plot'),'graph':kinds.count('graph'),'flow':kinds.count('flow')},'checks':checks,'blockers':['Full manual inspection of every final rendered page is pending.']}
          (root/'results/release_check_matrix.json').write_text(json.dumps(matrix,indent=2)+'\n')
          # Manifest excludes self-referential closure records and is regenerated after all artifacts below.
          out={}
          for p in sorted(root.rglob('*')):
            if p.is_file() and p.relative_to(root).as_posix() not in {'results/sha256_manifest.json','results/release_check_matrix.json','results/pdf_visual_review.json','results/publication_quality_report.md'}:
              out[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/'results/sha256_manifest.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({'pages':doc.page_count,'main_text_pages':main,'pdf_sha256':sha,'figures':len(rows),'plot':kinds.count('plot'),'graph':kinds.count('graph'),'flow':kinds.count('flow'),'visual_status':'BLOCKED_PENDING_MANUAL_REVIEW'},indent=2))
          PY
          # Exactly 9 core files at the release root; nested evidence remains in the required directories.
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 9
          python deploy.py --validate-only --allow-pending-visual
      - name: Update parent index and commit complete release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("Theoretical Research/Readme.md")
          text=p.read_text(encoding="utf-8")
          slug="The_Hodge_Obstruction_to_Escape_Proof_Therapy"
          title="The Hodge Obstruction to Escape-Proof Therapy: A Discrete-Hodge No-Go Result and Safety-Game Benchmark"
          row=f"| 2026.10.25 | {title} | Discrete-Hodge no-go result + synthetic robust safety-game benchmark | [{slug}]({slug}/) |"
          if slug not in text: p.write_text(text.rstrip()+"\n\n"+row+"\n",encoding="utf-8")
          PY
          rm -rf "$RELEASE/__pycache__"
          rm -rf "$STAGING"
          git add -A -- "$RELEASE" "$INDEX" "$STAGING" ".github/workflows/publish-hodge-obstruction.yml" ".github/workflows/verify-hodge-obstruction.yml"
          git diff --cached --check -- "$RELEASE/paper.tex" "$RELEASE/paper.bib" "$RELEASE/verify_model.py" "$RELEASE/deploy.py" "$RELEASE/README.md" "$RELEASE/CITATION.cff" "$RELEASE/.zenodo.json" "$RELEASE/schema_article.jsonld" "$INDEX"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "publish(hodge-obstruction): release verified safety-game preprint"
          RELEASE_SHA="$(git rev-parse HEAD)"
          git push origin main
          TAG="v2026.10.25.1"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG exists; refusing to overwrite it." >&2; exit 1
          fi
          git tag -a "$TAG" "$RELEASE_SHA" -m "The Hodge Obstruction to Escape-Proof Therapy v1.0.0"
          git push origin "$TAG"
          echo "Release commit SHA: $RELEASE_SHA"
          echo "Release tag: $TAG"
      - name: Dispatch independent verification of the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          payload="$(jq -n --arg sha "$RELEASE_SHA" --arg tag "v2026.10.25.1" '{ref:"main",inputs:{release_sha:$sha,tag:$tag,allow_pending_visual:"true"}}')"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/verify-hodge-obstruction.yml/dispatches" -d "$payload"
          echo "Independent verifier dispatched for $RELEASE_SHA."
