name: Build and publish repair-scheduling paper
on:
  push:
    branches: [main]
    paths: [".research-staging/aging-repair-scheduling/READY"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aging-repair-scheduling-release
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'publish(aging-repair-scheduling):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STAGING_DIR: ".research-staging/aging-repair-scheduling"
      RELEASE_DIR: "Theoretical Research/Aging_as_a_Decoding_Threshold_Repair_Scheduling_Under_Fixed_Maintenance_Throughput"
      SLUG: "Aging_as_a_Decoding_Threshold_Repair_Scheduling_Under_Fixed_Maintenance_Throughput"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scientific and PDF tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy==2.3.5" "matplotlib==3.10.8" "networkx==3.6.1" "PyMuPDF==1.26.7" "PyYAML==6.0.3" "Pillow==11.3.0"
          sudo apt-get update
          sudo apt-get install -y xz-utils latexmk texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Verify staged builder and generate release source
        run: |
          set -euo pipefail
          test -s "$STAGING_DIR/READY"
          # Rebuild from the staged builder, including repairs to an earlier release.
          rm -rf "$RELEASE_DIR"
          mkdir -p "$(dirname "$RELEASE_DIR")"
          cat "$STAGING_DIR"/builder_xz.b64.part* | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/builder.py.xz"
          echo "e4b9fe2b74bc1429b30a79fc4c1b3620842bc282203dbcc22db2f2e8417ab6cc  $RUNNER_TEMP/builder.py.xz" | sha256sum --check
          xz -dc "$RUNNER_TEMP/builder.py.xz" > "$RUNNER_TEMP/builder.py"
          python -m py_compile "$RUNNER_TEMP/builder.py"
          python "$RUNNER_TEMP/builder.py" "$RELEASE_DIR"
          # Normalize the font dependency to the TeX Live packages installed above.
          python - "$RELEASE_DIR" <<'PY'
          import sys
          from pathlib import Path
          root=Path(sys.argv[1]); p=root/'paper.tex'
          source=p.read_text(encoding='utf-8')
          old_font=r'\usepackage{newtxtext,newtxmath}'
          new_font=r'\usepackage{mathptmx}'
          old_math=r'\usepackage{amsmath,mathtools}'
          new_math=r'\usepackage{amsmath,amssymb,mathtools}'
          assert source.count(old_font)==1, 'unexpected manuscript font stanza'
          assert source.count(old_math)==1, 'unexpected manuscript math stanza'
          source=source.replace(old_font,new_font).replace(old_math,new_math)
          p.write_text(source,encoding='utf-8')
          (root/'results'/'tex_toolchain_compatibility.md').write_text(
              '# TeX toolchain compatibility adjustment\n\n'
              'The source generator initially selects newtxtext/newtxmath, which are not installed by the TeX Live package set on the GitHub runner. '
              'The release workflow deterministically replaces that stanza with mathptmx and explicitly loads amssymb for mathbb and related AMS symbols. '
              'Both changes are reflected in released paper.tex; the PDF is compiled from this exact patched source. No scientific content or numerical result is changed.\n',
              encoding='utf-8')
          print('Applied documented TeX font dependency compatibility adjustment.')
          PY
          # Repair a one-character typo in the generated verifier before its first execution.
          python - "$RELEASE_DIR" <<'PY'
          import sys
          from pathlib import Path
          root=Path(sys.argv[1]); p=root/'verify_model.py'
          source=p.read_text(encoding='utf-8')
          bad='root=Path(__file__).resolve().paren'
          good='root=Path(__file__).resolve().parent'
          assert source.count(bad)==1, f'expected exactly one executable verifier root-path typo, found {source.count(bad)}'
          p.write_text(source.replace(bad,good),encoding='utf-8')
          report=root/'results'/'tex_toolchain_compatibility.md'
          with report.open('a',encoding='utf-8') as f:
              f.write('\nThe generated verifier also contained a path-attribute typo (.paren); the workflow corrects it to .parent before model verification.\n')
          print('Applied and documented verifier path fix.')
          PY

      - name: Verify model, build PDF, and render every page
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile "$RELEASE_DIR/verify_model.py" "$RELEASE_DIR/deploy.py"
          python "$RELEASE_DIR/verify_model.py" 2>&1 | tee "$RELEASE_DIR/results/verify_model_stdout.txt"
          python "$RELEASE_DIR/deploy.py" --self-test > "$RELEASE_DIR/results/deploy_self_test.log"
          mkdir -p "$RUNNER_TEMP/latex-bin"
          cd "$RELEASE_DIR"
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error paper.tex 2>&1 | tee "$RUNNER_TEMP/latexmk_stdout.txt"
          cp "$RUNNER_TEMP/latexmk_stdout.txt" results/latex_build_stdout.txt
          pdfinfo paper.pdf > results/pdfinfo.txt
          pdffonts paper.pdf > results/pdffonts_report.txt
          pdftotext paper.pdf results/paper_extracted.txt
          test -s paper.pdf
          test "$(pdfinfo paper.pdf | awk '/^Pages:/ {print $2}')" -ge 7
          python - "$RELEASE_DIR" "$RUNNER_TEMP/aging-pages" "$GITHUB_SHA" <<'PY'
          import sys,json,hashlib,re,math,datetime
          from pathlib import Path
          import fitz,yaml
          from PIL import Image,ImageDraw
          root=Path.cwd(); pages=Path(sys.argv[2]); pages.mkdir(parents=True,exist_ok=True)
          source=(root/'paper.tex').read_text(encoding='utf-8'); bib=(root/'paper.bib').read_text(encoding='utf-8')
          assert len(re.findall(r'\\begin\{table\}',source))>=5
          assert len(re.findall(r'\\begin\{figure\}',source))>=8
          keys=set(re.findall(r'@\w+\s*\{\s*([^,\s]+)',bib))
          cites=set(k.strip() for b in re.findall(r'\\cite\w*\{([^}]+)\}',source) for k in b.split(','))
          assert cites<=keys, f'missing bibliography keys: {sorted(cites-keys)}'
          yaml.safe_load((root/'CITATION.cff').read_text(encoding='utf-8'))
          json.loads((root/'.zenodo.json').read_text(encoding='utf-8')); json.loads((root/'schema_article.jsonld').read_text(encoding='utf-8'))
          doc=fitz.open(root/'paper.pdf'); assert len(doc)>=7
          out=root/'results'/'pdf_pages'; out.mkdir(exist_ok=True); cards=[]
          for i,p in enumerate(doc,1):
              pix=p.get_pixmap(matrix=fitz.Matrix(140/72,140/72),alpha=False); target=out/f'page-{i:02d}.png'; pix.save(target)
              im=Image.open(target).convert('RGB'); im.thumbnail((255,360)); card=Image.new('RGB',(275,395),'white'); card.paste(im,((275-im.width)//2,22)); ImageDraw.Draw(card).text((10,5),f'Page {i:02d}',fill='black'); cards.append(card)
              pix2=pages/f'page-{i:02d}.png'; pix.save(pix2)
          sheet=Image.new('RGB',(825,math.ceil(len(cards)/3)*395),(225,225,225))
          for i,im in enumerate(cards): sheet.paste(im,((i%3)*275,(i//3)*395))
          sheet.save(root/'results'/'pdf_contact_sheet.png'); sheet.save(pages/'contact_sheet.png')
          vr=json.loads((root/'results'/'verification_report.json').read_text(encoding='utf-8')); assert vr.get('status')=='PASS' and vr.get('checks_failed')==0, vr
          digest=hashlib.sha256((root/'paper.pdf').read_bytes()).hexdigest(); now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          (root/'results'/'pdf_visual_review.json').write_text(json.dumps({'status':'PENDING','inspection_timestamp_utc':now,'paper_pdf_sha256':digest,'page_count':len(doc),'render_dpi':140,'all_pages_rendered':True,'pages_rendered':list(range(1,len(doc)+1)),'pages_individually_reviewed':[],'issues':[{'severity':'pending','issue':'Independent visual review of the exact CI-built PDF is not yet closed.'}],'final_disposition':'BLOCKED pending page-by-page review of this exact PDF hash.'},indent=2)+'\n')
          (root/'results'/'publication_quality_report.json').write_text(json.dumps({'status':'BLOCKED_PENDING_VISUAL_REVIEW','paper_pdf_sha256':digest,'pages':len(doc),'table_environments':len(re.findall(r'\\begin\{table\}',source)),'figure_environments':len(re.findall(r'\\begin\{figure\}',source)), 'model_verification':{'status':vr['status'],'checks_passed':vr['checks_passed'],'checks_total':vr['checks_total']},'biological_or_lifespan_validation':'NOT_PERFORMED','trigger_commit_sha':sys.argv[3]},indent=2)+'\n')
          (root/'results'/'release_check_matrix.json').write_text(json.dumps({'release_status':'BLOCKED','repository':'Devanik21/The-Invention-Archive','target_branch':'main','trigger_commit_sha':sys.argv[3],'pdf_sha256':digest,'pdf_pages':len(doc),'checks':[{'name':'Model verification','status':'PASS','evidence':'results/verify_model_stdout.txt'},{'name':'LaTeX compilation and page count','status':'PASS','evidence':'GitHub Actions build log and paper.pdf'},{'name':'Metadata and bibliography preflight','status':'PASS','evidence':'CITATION.cff; paper.bib; JSON metadata'},{'name':'Full-page visual review','status':'PENDING','evidence':'results/pdf_visual_review.json; uploaded page-render artifact'},{'name':'Remote read-back and final-SHA CI closure','status':'PENDING','evidence':'post-commit reconciliation'}],'blockers':['Independent inspection of exact PDF','Final-SHA remote check reconciliation']},indent=2)+'\n')
          PY
          rm -f paper.aux paper.bbl paper.blg paper.fdb_latexmk paper.fls paper.log paper.out paper.toc paper.lof paper.lot paper.synctex.gz paper.run.xml paper.nav paper.snm paper.xdv paper.vrb paper.upa
          python deploy.py --validate-only > results/deploy_validate_run.log
          rm -rf __pycache__ results/__pycache__
          cd "$GITHUB_WORKSPACE"
          python - "$RELEASE_DIR" <<'PY'
          import sys,hashlib,json
          from pathlib import Path
          r=Path(sys.argv[1]); p=r/'results'/'sha256_manifest.json'
          files={str(x.relative_to(r)):hashlib.sha256(x.read_bytes()).hexdigest() for x in sorted(r.rglob('*')) if x.is_file() and x!=p and '__pycache__' not in x.parts}
          p.write_text(json.dumps({'algorithm':'sha256','files':files},indent=2)+'\n')
          expected={'paper.tex','paper.pdf','verify_model.py','README.md','CITATION.cff','paper.bib','.zenodo.json','schema_article.jsonld','deploy.py'}
          actual={x.name for x in r.iterdir() if x.is_file()}; assert actual==expected,(expected-actual,actual-expected)
          assert json.loads((r/'results'/'verification_report.json').read_text())['checks_failed']==0
          print(f'PASS: 9 root files, {len(files)} evidence files hashed')
          PY
      - name: Upload PDF and all rendered pages for inspection
        uses: actions/upload-artifact@v4
        with:
          name: aging-repair-scheduling-pdf-review
          if-no-files-found: error
          retention-days: 14
          path: |
            Theoretical Research/Aging_as_a_Decoding_Threshold_Repair_Scheduling_Under_Fixed_Maintenance_Throughput/paper.pdf
            Theoretical Research/Aging_as_a_Decoding_Threshold_Repair_Scheduling_Under_Fixed_Maintenance_Throughput/results/pdf_contact_sheet.png
            ${{ runner.temp }}/aging-pages/*.png
      - name: Create bundle, update index, publish, and verify remote files
        shell: bash
        run: |
          set -euo pipefail
          # Make generated text deterministic and compatible with git diff --check.
          python - "$RELEASE_DIR" <<'PY'
          import sys
          from pathlib import Path
          root=Path(sys.argv[1])
          for p in root.rglob("*.csv"):
              if "__pycache__" in p.parts:
                  continue
              text=p.read_text(encoding="utf-8").replace("\r\n","\n").replace("\r","\n")
              lines=[line.rstrip(" " + chr(9)) for line in text.splitlines()]
              p.write_text("\n".join(lines).rstrip("\n")+"\n",encoding="utf-8",newline="\n")
          for p in (root/"results").glob("*.txt"):
              text=p.read_text(encoding="utf-8",errors="replace").replace("\r\n","\n").replace("\r","\n")
              lines=[line.rstrip(" " + chr(9)) for line in text.splitlines()]
              p.write_text("\n".join(lines).rstrip("\n")+"\n",encoding="utf-8",newline="\n")
          p=root/"verify_model.py"
          text=p.read_text(encoding="utf-8").replace("\r\n","\n").replace("\r","\n")
          p.write_text("\n".join(line.rstrip(" " + chr(9)) for line in text.splitlines()).rstrip("\n")+"\n",encoding="utf-8",newline="\n")
          # README metadata uses Markdown hard breaks; express them as explicit HTML breaks.
          p=root/"README.md"
          text=p.read_text(encoding="utf-8").replace("\r\n","\n").replace("\r","\n")
          lines=[]
          for line in text.splitlines():
              if line.endswith("  "):
                  line=line.rstrip(" " + chr(9))+"<br>"
              else:
                  line=line.rstrip(" " + chr(9))
              lines.append(line)
          p.write_text("\n".join(lines).rstrip("\n")+"\n",encoding="utf-8",newline="\n")
          PY
          INDEX="Theoretical Research/Readme.md"
          BUNDLE="Theoretical Research/${SLUG}_complete_bundle.zip"
          ROW="| 2026.10.24 | Aging as a Decoding Threshold: Repair Scheduling Under Fixed Maintenance Throughput | Synthetic-model methods preprint | [${SLUG}](${SLUG}/) |"
          python - "$INDEX" "$SLUG" "$ROW" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); slug=sys.argv[2]; row=sys.argv[3]
          lines=p.read_text(encoding="utf-8").splitlines()
          matches=[i for i,line in enumerate(lines) if slug in line and line.lstrip().startswith("|")]
          if len(matches)>1:
              raise SystemExit(f"duplicate index rows for {slug}: {len(matches)}")
          if matches:
              lines[matches[0]]=row
          else:
              lines.extend(["",row])
          p.write_text("\n".join(lines).rstrip("\n")+"\n",encoding="utf-8",newline="\n")
          PY
          rm -f "$BUNDLE"
          (cd "Theoretical Research" && zip -qr "${SLUG}_complete_bundle.zip" "$SLUG" -x '*/__pycache__/*' '*.pyc')
          rm -rf "$STAGING_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$RELEASE_DIR" "$INDEX" "$BUNDLE" "$STAGING_DIR"
          git diff --cached --check
          git commit -m "publish(aging-repair-scheduling): archive verified research bundle"
          git fetch origin main --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          for f in paper.tex paper.pdf verify_model.py README.md CITATION.cff paper.bib .zenodo.json schema_article.jsonld deploy.py; do
            test "$(git hash-object "$RELEASE_DIR/$f")" = "$(git rev-parse "origin/main:$RELEASE_DIR/$f")"
          done
          test "$(git hash-object "$BUNDLE")" = "$(git rev-parse "origin/main:$BUNDLE")"
          git show "origin/main:$INDEX" | grep -Fq "$SLUG"
          echo "Artifact commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Nine root-file hashes, bundle hash, and index entry read back from origin/main." >> "$GITHUB_STEP_SUMMARY"
