name: Build FER paper PDF

on:
  push:
    branches: [main]
    paths:
      - "Theoretical Research/Functorial_Epigenetic_Realignment_FER_Reversing_Topological_Drift_via_Information_Geometric_Optimal_Transport_and_Mechanotransductive_Acoustic_Holography/paper.tex"
      - "Theoretical Research/Functorial_Epigenetic_Realignment_FER_Reversing_Topological_Drift_via_Information_Geometric_Optimal_Transport_and_Mechanotransductive_Acoustic_Holography/paper.bib"
      - ".github/workflows/build-fer-paper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Compile LaTeX manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper.tex
          working_directory: "Theoretical Research/Functorial_Epigenetic_Realignment_FER_Reversing_Topological_Drift_via_Information_Geometric_Optimal_Transport_and_Mechanotransductive_Acoustic_Holography"
      - name: Commit compiled PDF to archive
        env:
          RELEASE_DIR: "Theoretical Research/Functorial_Epigenetic_Realignment_FER_Reversing_Topological_Drift_via_Information_Geometric_Optimal_Transport_and_Mechanotransductive_Acoustic_Holography"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${RELEASE_DIR}/paper.pdf"
          if git diff --cached --quiet; then
            echo "paper.pdf is unchanged."
            exit 0
          fi
          git commit -m "build(FER): compile and archive preprint PDF"
          git push origin HEAD:main
