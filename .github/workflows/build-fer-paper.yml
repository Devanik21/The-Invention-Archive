name: Build FER paper PDF

on:
  push:
    branches: [main]
    paths:
      - "Theoretical Research/Functorial_Epigenetic_Realignment_FER_Reversing_Topological_Drift_via_Information_Geometric_Optimal_Transport_and_Mechanotransductive_Acoustic_Holography/paper.tex"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper.tex
          working_directory: "Theoretical Research/Functorial_Epigenetic_Realignment_FER_Reversing_Topological_Drift_via_Information_Geometric_Optimal_Transport_and_Mechanotransductive_Acoustic_Holography"
      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: FER-paper-pdf
          path: "Theoretical Research/Functorial_Epigenetic_Realignment_FER_Reversing_Topological_Drift_via_Information_Geometric_Optimal_Transport_and_Mechanotransductive_Acoustic_Holography/paper.pdf"
